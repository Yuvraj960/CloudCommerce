name: Docker Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger

env:
  REGISTRY: ghcr.io

jobs:
  # ── Build & push all services ─────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - service: product-service
            context: .
            dockerfile: services/product-service/Dockerfile
          - service: cart-service
            context: .
            dockerfile: services/cart-service/Dockerfile
          - service: order-service
            context: .
            dockerfile: services/order-service/Dockerfile
          - service: payment-service
            context: .
            dockerfile: services/payment-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Remove leading 'refs/heads/' from branch name
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|refs/heads/||')
          # Short SHA
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "full_image=${{ env.REGISTRY }}/${OWNER}/cloudcommerce/${{ matrix.service }}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudcommerce/${{ matrix.service }}:${{ steps.tags.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudcommerce/${{ matrix.service }}:${{ steps.tags.outputs.branch }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudcommerce/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ── Confirmation ────────────────────────────────────────────────────────────
  done:
    name: All images pushed
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "## Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SHA tag: \`$SHA_SHORT\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to GHCR:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo '```' >> $GITHUB_STEP_SUMMARY
          for SVC in auth-service product-service cart-service order-service payment-service notification-service frontend; do
            echo "${{ env.REGISTRY }}/${OWNER}/cloudcommerce/${SVC}:${SHA_SHORT}" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY