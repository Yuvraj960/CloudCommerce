services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cloudcommerce
      POSTGRES_PASSWORD: cloudcommerce
      POSTGRES_DB: cloudcommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcommerce -d cloudcommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Single listener. KAFKA_ADVERTISED_LISTENERS is overridden at runtime per-deployment:
      # - In docker-compose: use 'kafka' hostname so containers can resolve it
      # - In local dev without Docker: use 'localhost'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns
      DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Application Services ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://cloudcommerce:cloudcommerce@postgres:5432/cloudcommerce
      JWT_SECRET: change-me-in-production-min-32-chars-long
      JWT_ACCESS_EXPIRY_SECONDS: "900"
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ..
      dockerfile: services/product-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      SERVICE_NAME: product-service
      NODE_ENV: production
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/cloudcommerce
      JWT_SECRET: change-me-in-production-min-32-chars-long
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: cloudcommerce-images
      PORT: "3002"
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy
    # S3 bucket must be pre-created — LocalStack won't auto-create buckets.
    # Run once: curl -X PUT "http://localhost:4566/cloudcommerce-images"
    command: >
      /bin/sh -c "
        curl -s -X PUT http://localstack:4566/cloudcommerce-images &&
        node dist/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cart-service:
    build:
      context: ..
      dockerfile: services/cart-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: cart-service
      NODE_ENV: production
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-min-32-chars-long
      PORT: "3003"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      SERVICE_NAME: order-service
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://cloudcommerce:cloudcommerce@postgres:5432/cloudcommerce
      KAFKA_BROKER: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      JWT_SECRET: change-me-in-production-min-32-chars-long
      PORT: "3004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://cloudcommerce:cloudcommerce@postgres:5432/cloudcommerce
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP_ID: payment-service-group
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      PORT: "3005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      PORT: "3006"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service

volumes:
  postgres_data:
  mongo_data:
  localstack_data: