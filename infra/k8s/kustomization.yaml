# Kustomize orchestration for cloudcommerce Kubernetes manifests
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  # Base infrastructure
  - base/namespaces.yaml
  - base/configmaps.yaml
  - base/secrets.yaml
  - base/infra.yaml
  - base/ingress.yaml
  - base/hpa.yaml
  # Service deployments
  - services/auth.yaml
  - services/product.yaml
  - services/cart.yaml
  - services/order.yaml
  - services/payment.yaml
  - services/notification.yaml
  - services/frontend.yaml

commonLabels:
  app.kubernetes.io/name: cloudcommerce
  app.kubernetes.io/part-of: cloudcommerce-platform
  app.kubernetes.io/managed-by: kustomize

configMapGenerator: []