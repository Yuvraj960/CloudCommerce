# Grafana datasource provisioning — ConfigMap
# Auto-configures Prometheus and Loki as data sources for Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
          httpMethod: GET
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        editable: false
        jsonData:
          timeInterval: 30s
          derivedFields:
            - matcherRegex: "\"trace_id\":\"([^\"]+)\""
              name: Trace ID
              url: "https://grafana.com/explore?left={\"queries\":[{\"query\":\"${__value.raw}\"}]}"
              datasourceUid: loki