# Loki configuration — ConfigMap
# Single Binary mode (no microservices) — simple and sufficient for local dev
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v13
          index:
            period: 24h
            prefix: loki_

    storage_config:
      boltdb_shipper:
        shared_store: filesystem
        cache_location: /loki/index
      filesystem:
        directory: /loki/chunks

    chunk_store_config:
      chunk_cache:
        writeback_gc_interval: 15m
        writeback_idle_dal: 15m
        writeback_buffer_size: 1.5e+7

    querier:
      max_query_fan_out: 8
      query_timeout: 3m

    query_scheduler:
      max_outstanding_requests_per_tenant: 100

    compactor:
      working_directory: /loki/retention
      retention_enabled: true
      delete_interval: 10m
      delete_request_cancel_period: 5m