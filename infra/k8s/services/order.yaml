apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "3004"
            - name: KAFKA_GROUP_ID
              value: order-service-group
            # Direct infra URLs — avoids cross-namespace ConfigMap dependency
            - name: KAFKA_BROKER
              value: kafka.infra.svc.cluster.local:9092
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"
          envFrom:
            - secretRef:
                name: order-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order
spec:
  clusterIP: None
  selector:
    app: order-service
  ports:
    - port: 3004
      targetPort: 3004