apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: SERVICE_NAME
              value: auth-service
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: JWT_ACCESS_EXPIRY_SECONDS
              value: "900"
            - name: PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: auth-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
spec:
  clusterIP: None
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001